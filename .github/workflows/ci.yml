name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pinned rather than macos-latest: a runner image that moves under us changes the Swift and
    # Xcode versions without a commit, and the first sign of it is a build that fails for nobody's
    # reason.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The adapter loads simulator frameworks from whichever Xcode is selected, so the version
          # is part of the build rather than an ambient detail.
          xcode="/Applications/Xcode_${{ vars.XCODE_VERSION || '16.4' }}.app"
          if [ ! -d "${xcode}" ]; then
            echo "::error::${xcode} is not on this runner. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=${xcode}/Contents/Developer" >> "${GITHUB_ENV}"
          "${xcode}/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Build
        run: scripts/build.sh

      - name: Test
        # The integration tests need a booted simulator and are gated behind ODH_INTEGRATION, which
        # is deliberately not set here: they would skip anyway, and a skip that looks like a pass is
        # worse than an honest absence.
        run: swift test --package-path engine
