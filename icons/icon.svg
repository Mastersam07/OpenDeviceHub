<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="OpenDeviceHub">
  <defs>
    <!-- Read off the rendered icon rather than restated, because the drawn gradient interpolates in
         a different colour space from the one an SVG stop pair would. -->
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="944">
      <stop offset="0.000" stop-color="#6275E9"/>
      <stop offset="0.125" stop-color="#5C6FDF"/>
      <stop offset="0.250" stop-color="#5669D5"/>
      <stop offset="0.375" stop-color="#5063CC"/>
      <stop offset="0.500" stop-color="#4B5DC1"/>
      <stop offset="0.625" stop-color="#4557B8"/>
      <stop offset="0.750" stop-color="#3F50AD"/>
      <stop offset="0.875" stop-color="#394AA3"/>
      <stop offset="1.000" stop-color="#314398"/>
    </linearGradient>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="190" ry="190" fill="url(#plate)"/>

  <g opacity="0.75">
    <rect x="286" y="194" width="268" height="500" rx="54" ry="54" fill="none" stroke="#FFFFFF" stroke-width="24"/>
    <rect x="382" y="238" width="100" height="30" rx="15" ry="15" fill="#FFFFFF"/>
    <rect x="382" y="640" width="100" height="14" rx="7" ry="7" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <rect x="452" y="262" width="292" height="548" rx="54" ry="54" fill="url(#plate)"/>
  <rect x="452" y="262" width="292" height="548" rx="54" ry="54" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <rect x="548" y="306" width="100" height="30" rx="15" ry="15" fill="#FFFFFF"/>
  <rect x="548" y="756" width="100" height="14" rx="7" ry="7" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
